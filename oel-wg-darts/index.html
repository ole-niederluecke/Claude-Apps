<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Öl WG Darts Trainer</title>
<meta name="theme-color" content="#E7ECE8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Öl WG Darts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script>window.OELWG_STANDALONE = true;</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
img{max-width:100%} [hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one-screen app. Sticky header, scrolling content, tab bar at the bottom.
   In a game: scoreboard on top, input pad pinned to the bottom like the oche line. */
:root{
  --bg:#E7ECE8; --surface:#FFFFFF; --surface-2:#F1F4F1; --line:#D0D9D2; --fg:#13201A; --muted:#55665D;
  --red:#C21F31; --on-red:#FFFFFF; --red-soft:#F8E0E3;
  --green:#14683F; --on-green:#FFFFFF; --green-soft:#D9EDE1;
  --gold:#8F650A; --gold-soft:#F5EACB;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1411; --surface:#16201B; --surface-2:#1D2923; --line:#2B3A33; --fg:#E5EDE8; --muted:#97A89E;
    --red:#F04D5E; --on-red:#1E0509; --red-soft:#3B191E;
    --green:#4FCB8D; --on-green:#05200F; --green-soft:#163020;
    --gold:#E6B94C; --gold-soft:#3A2F12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#16201B; --surface-2:#1D2923; --line:#2B3A33; --fg:#E5EDE8; --muted:#97A89E;
  --red:#F04D5E; --on-red:#1E0509; --red-soft:#3B191E;
  --green:#4FCB8D; --on-green:#05200F; --green-soft:#163020;
  --gold:#E6B94C; --gold-soft:#3A2F12; color-scheme:dark;
}
/* In-app theme choice (settings) overrides the viewer's theme */
html:root[data-app-theme="light"]{
  --bg:#E7ECE8; --surface:#FFFFFF; --surface-2:#F1F4F1; --line:#D0D9D2; --fg:#13201A; --muted:#55665D;
  --red:#C21F31; --on-red:#FFFFFF; --red-soft:#F8E0E3;
  --green:#14683F; --on-green:#FFFFFF; --green-soft:#D9EDE1;
  --gold:#8F650A; --gold-soft:#F5EACB; color-scheme:light;
}
html:root[data-app-theme="dark"]{
  --bg:#0D1411; --surface:#16201B; --surface-2:#1D2923; --line:#2B3A33; --fg:#E5EDE8; --muted:#97A89E;
  --red:#F04D5E; --on-red:#1E0509; --red-soft:#3B191E;
  --green:#4FCB8D; --on-green:#05200F; --green-soft:#163020;
  --gold:#E6B94C; --gold-soft:#3A2F12; color-scheme:dark;
}
/* Colour schemes (settings): swap the two accent colours, per light/dark mode */
html[data-palette="ocean"][data-mode="light"]{--red:#1D5FC4;--on-red:#FFFFFF;--red-soft:#DCE6F8;--green:#0B7A70;--on-green:#FFFFFF;--green-soft:#D3EEEA}
html[data-palette="ocean"][data-mode="dark"]{--red:#6EA3FF;--on-red:#071530;--red-soft:#16243F;--green:#3FD0C0;--on-green:#032220;--green-soft:#10302D}
html[data-palette="pub"][data-mode="light"]{--red:#9E2235;--on-red:#FFFFFF;--red-soft:#F4DFE2;--green:#9A5F0C;--on-green:#FFFFFF;--green-soft:#F6E8CF}
html[data-palette="pub"][data-mode="dark"]{--red:#F0697A;--on-red:#2A0710;--red-soft:#3A1A20;--green:#E7B04F;--on-green:#241600;--green-soft:#3A2C12}
html[data-palette="violet"][data-mode="light"]{--red:#7A3FD1;--on-red:#FFFFFF;--red-soft:#ECE2FA;--green:#3F7F12;--on-green:#FFFFFF;--green-soft:#E4F0D4}
html[data-palette="violet"][data-mode="dark"]{--red:#B48CFF;--on-red:#160A30;--red-soft:#2A1F45;--green:#A6E05A;--on-green:#142200;--green-soft:#22301A}
html[data-palette="orange"][data-mode="light"]{--red:#C9430C;--on-red:#FFFFFF;--red-soft:#FCE4D8;--green:#1B6E8C;--on-green:#FFFFFF;--green-soft:#D6EAF1}
html[data-palette="orange"][data-mode="dark"]{--red:#FF8A50;--on-red:#2A0E00;--red-soft:#3D2214;--green:#5CC3E6;--on-green:#002331;--green-soft:#12303B}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input{font:inherit;color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;min-width:0}
.gear{position:relative;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--fg)}
.gear svg{width:21px;height:21px}
.gear .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.gear .dot.ok{background:var(--green)} .gear .dot.warn{background:var(--gold)}
.gear.on{border-color:var(--red);color:var(--red)}
.brand-mark{width:26px;height:26px;border-radius:50%;flex:none;
  background:radial-gradient(circle,var(--red) 0 13%,var(--green) 13% 22%,transparent 22%),
  repeating-conic-gradient(from -9deg,var(--fg) 0 18deg,var(--surface) 18deg 36deg);
  box-shadow:0 0 0 2px var(--fg)}
.sync{font-size:12px;color:var(--muted);text-align:right;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--green)}
.sync.warn::before{background:var(--gold)}

/* Content */
.content{flex:1;padding-block:6px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;text-wrap:balance;letter-spacing:.01em}
.h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.h3{font-weight:600;font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lead{margin:6px 0 0;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.ring{font-family:var(--display);font-size:13px;letter-spacing:.32em;color:var(--muted);white-space:nowrap;overflow:hidden;opacity:.8;margin-top:-14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn-primary{background:var(--red);color:var(--on-red);border-color:var(--red)}
.btn-green{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-lg{min-height:54px;font-size:17px;width:100%}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn-danger{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1;min-width:0}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-height:96px;transition:transform .12s, border-color .12s}
.mode:hover{border-color:var(--fg)}
.mode:active{transform:scale(.985)}
.mode-name{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
.mode-desc{color:var(--muted);font-size:13.5px}
.modes.short{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mode.short{min-height:0;padding:12px 16px}
.mode.match .mode-name{color:var(--red)}
.mode.train .mode-name{color:var(--green)}

.resume{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--green)}
.resume b{display:block}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.opt{display:flex;flex-direction:column;gap:6px}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pal{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13.5px}
.pal .sw{display:flex;gap:4px}
.pal .sw i{width:22px;height:22px;border-radius:50%;display:block}
.pal.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.shead{display:flex;align-items:center;gap:6px;margin-left:-8px}
.panel.tight{padding:12px 14px;gap:10px}
.opts{display:flex;flex-direction:column}
.opts .opt{display:grid;grid-template-columns:minmax(92px,30%) minmax(0,1fr);align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.opts .opt.wide{grid-template-columns:minmax(0,1fr);gap:6px}
.opts .opt:first-child{border-top:0;padding-top:0}
.opts .opt-label{font-size:14px;color:var(--fg)}
/* every control fills the same column, options share it equally */
.opts .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;width:100%}
.opts .seg button{min-height:36px;padding:5px 4px;font-size:13.5px;border-radius:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts .stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;width:100%;align-self:auto}
.opts .stepper button{width:auto;height:36px;font-size:18px}
.opts .stepper output{min-width:0;font-size:19px}
.tight .chips{gap:6px}
.tight .chip{min-height:36px;padding:5px 12px 5px 7px;font-size:14px}
.tight .field{min-height:38px;padding:7px 10px}
.tight .row .btn{min-height:38px;padding:7px 12px}
.tight .orow{padding:3px 6px 3px 10px}
.tight .orow .ib{width:32px;height:32px}
.tight .orow .btn-sm{min-height:30px;padding:4px 10px}
.opt-label{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:500;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg.mini{gap:0;flex-wrap:nowrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg.mini button{min-height:32px;padding:4px 10px;font-size:13px;border:0;border-radius:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2);align-self:flex-start}
.stepper button{width:44px;height:40px;font-size:20px;font-weight:600}
.stepper output{min-width:64px;text-align:center;font-family:var(--display);font-size:22px;font-weight:600}
.note{font-size:13px;color:var(--gold);background:var(--gold-soft);padding:8px 10px;border-radius:8px}

.rules summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"＋";color:var(--muted);font-weight:500}
.rules[open] summary::after{content:"－"}
.rules[open] summary{margin-bottom:4px}
.rtext{display:flex;flex-direction:column;gap:10px;max-width:65ch}
.rtext p{margin:0}
.rtext h4{margin:6px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rtext ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rtext b{font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
.chip .badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--muted)}
.chip.on{border-color:var(--green);background:var(--surface);box-shadow:inset 0 0 0 1px var(--green)}
.chip.on .badge{background:var(--green);color:var(--on-green)}
.chip.c1.on{border-color:var(--red);background:var(--surface);box-shadow:inset 0 0 0 1px var(--red)} .chip.c1.on .badge{background:var(--red);color:var(--on-red)}
.chip.c3.on{border-color:var(--gold);background:var(--surface);box-shadow:inset 0 0 0 1px var(--gold)} .chip.c3.on .badge{background:var(--gold);color:var(--surface)}
.field{flex:1;min-width:0;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.field:focus{outline:2px solid var(--green);outline-offset:0}

.order{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.orow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-top:1px solid var(--line);background:var(--surface-2);min-width:0}
.orow:first-child{border-top:0}
.orow .pos{font-family:var(--display);font-size:20px;font-weight:700;width:22px;color:var(--muted)}
.orow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.orow .first{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.04em;text-transform:uppercase;padding:0 6px}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:780px;margin:0 auto}
.tab{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--red)}

/* Stats */
.c1{--pc:var(--red)} .c2{--pc:var(--green)} .c3{--pc:var(--gold)}
.who{display:inline-flex;align-items:center;gap:6px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
table.cmp th:first-child{font-weight:500;color:var(--fg);font-size:13.5px;white-space:normal;min-width:110px}
table.cmp th,table.cmp td{padding-inline:5px}
.tbl.fin th:nth-child(2),.tbl.fin td:nth-child(2){text-align:left}
table.cmp thead th{color:var(--fg);font-size:13px}
table.cmp td.best{color:var(--green);font-weight:700}
.spark{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.duel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.duel-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.duel-score .who{max-width:none;font-weight:700;font-size:15px}
.duel-score .who:last-child{justify-self:end;flex-direction:row-reverse}
.duel-score .ds{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.duel-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.duel-bar i{display:block;height:100%}
.duel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

/* Tournament */
.bracket-scroll{overflow-x:auto;margin-inline:-4px;padding:4px}
.bracket{display:flex;gap:14px;min-width:max-content}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:12px;width:210px}
.bcol h4{margin:0 0 2px;font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media (max-width:640px){.bracket{flex-direction:column;min-width:0;gap:20px}.bcol{width:auto}.bracket-scroll{overflow:visible}}
.match{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mrow.win{font-weight:700}
.mrow.win .sc{color:var(--green)}
.mrow .sc{font-family:var(--display);font-size:18px;font-weight:700}
.mrow.tbd{color:var(--muted);font-style:italic}
.mact{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--surface-2)}
.mact .btn{flex:1}
.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tbl tr.me td{background:var(--surface-2);font-weight:600}
.champ{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--gold-soft);color:var(--fg);border:1px solid var(--gold)}
.champ b{font-family:var(--display);font-size:26px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.pill.done{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}

/* Bull-off */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bopt{min-height:76px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px}
.bopt.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}

<script>
"use strict";
/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const fmt1 = x => (Number.isFinite(x) ? x : 0).toFixed(1).replace(".", ",");
const pct = (a, b) => b ? Math.round(a / b * 100) + " %" : "–";
const fmtDate = ts => { const d = new Date(ts); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}) + ", " + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); };
const monthKey = ts => { const d = new Date(ts); return "h-" + d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); };
const shuffle = a => { a = [...a]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ================= Darts maths ================= */
const SEGS = (() => { const a = []; for (let n = 1; n <= 20; n++) a.push({n,m:1,v:n},{n,m:2,v:2*n},{n,m:3,v:3*n}); a.push({n:25,m:1,v:25},{n:25,m:2,v:50}); return a; })();
const POSSIBLE = (() => { const v = [0, ...SEGS.map(s => s.v)], set = new Set(); for (const a of v) for (const b of v) for (const c of v) set.add(a+b+c); return set; })();
function dartLabel(n, m){ if (!n) return "–"; if (n === 25) return m === 2 ? "Bull" : "25"; return (m === 3 ? "T" : m === 2 ? "D" : "") + n; }
const DBL_PREF = {40:10, 32:10, 16:8, 20:8, 24:7, 36:7, 8:6, 12:6, 50:5, 4:5};
const finOk = (s, out) => out === "straight" || s.m === 2 || (out === "master" && s.m === 3);
const setupScore = s => s.n === 25 ? -2 : s.m === 3 ? (s.n === 20 ? 3 : s.n === 19 ? 2.5 : s.n >= 16 ? 2 : 1) : s.m === 1 ? 1.5 : 0.5;
const finScore = s => s.m === 2 ? (DBL_PREF[s.v] ?? 3) : s.m === 3 ? 2 : 1.5;
const coCache = new Map();
function checkout(rem, darts, out){
  if (rem <= 0 || rem > 180 || darts < 1) return null;
  if (out !== "straight" && rem > 170) return null;
  const key = rem + "|" + darts + "|" + out;
  if (coCache.has(key)) return coCache.get(key);
  const fins = SEGS.filter(s => finOk(s, out));
  let best = null;
  for (let d = 1; d <= darts && !best; d++) {
    let bs = -1e9;
    if (d === 1) { for (const f of fins) if (f.v === rem) { const sc = finScore(f); if (sc > bs) { bs = sc; best = [f]; } } }
    else if (d === 2) { for (const a of SEGS) { const r = rem - a.v; if (r <= 0) continue; for (const f of fins) if (f.v === r) { const sc = setupScore(a) + finScore(f); if (sc > bs) { bs = sc; best = [a,f]; } } } }
    else { for (const a of SEGS) { const r1 = rem - a.v; if (r1 <= 0) continue; for (const b of SEGS) { const r2 = r1 - b.v; if (r2 <= 0) continue; for (const f of fins) if (f.v === r2) { const sc = setupScore(a) + setupScore(b)*0.9 + finScore(f); if (sc > bs) { bs = sc; best = [a,b,f]; } } } } }
  }
  const res = best ? best.map(s => dartLabel(s.n, s.m)) : null;
  coCache.set(key, res);
  return res;
}

/* ================= State ================= */
const LS_DATA = "oche.data.v1", LS_GAME = "oche.game.v1", LS_PREFS = "oche.prefs.v1";
let S = lsGet(LS_DATA) || {players:[], history:[], tournaments:[]};
S.players ||= []; S.history ||= []; S.tournaments ||= [];
let G = lsGet(LS_GAME);
const prefs = lsGet(LS_PREFS) || {};
if (prefs.setupV !== 3) { delete prefs.setup; prefs.setupV = 3; lsSet(LS_PREFS, prefs); }
let UI = {view: "play", mode: null, setup: {}, sel: prefs.sel || [], kp: "", mult: 1, modal: null,
  cmp: prefs.cmp || [], statsCat: "multi", trainSolo: "all", tId: null, editP: null, bo: null,
  tf: {name:"", format:"ko", sel:[], start:501, outRule:"double", legs:2, shuffle:"yes", twice:"no", startMode:"bull"}};

const players = () => S.players.filter(p => !p.deleted).sort((a,b) => a.createdAt - b.createdAt);
const pname = id => S.players.find(p => p.id === id)?.name ?? "Unbekannt";
const liveHistory = () => S.history.filter(h => !h.deleted && h.res && MODES[h.mode]).sort((a,b) => b.date - a.date);

/* ================= Sync (account storage via db, local fallback) ================= */
/* Standalone build (own web address, installable): data lives on the device only */
const STANDALONE = !!window.OELWG_STANDALONE;
const Sync = {db:null, uid:null, status: STANDALONE ? "device" : "local", dirty:new Set(), timer:null, busy:false};
const SYNC_TEXT = {device:"Auf diesem Gerät gespeichert", local:"Nur auf diesem Gerät", loading:"Lädt …", saving:"Speichert …", ok:"In deinem Konto gespeichert", offline:"Nicht verbunden, speichert später", full:"Speicher voll"};
function syncHTML(){ const c = Sync.status === "ok" ? "ok" : (Sync.status === "offline" || Sync.status === "full") ? "warn" : ""; return `<div id="sync" class="sync ${c}">${SYNC_TEXT[Sync.status]}${Sync.status === "offline" && Sync.lastError ? " · Grund: " + esc(Sync.lastError) : ""}</div>`; }
const syncCls = () => Sync.status === "ok" || Sync.status === "device" ? "ok" : (Sync.status === "offline" || Sync.status === "full") ? "warn" : "";
function setSync(s){ Sync.status = s; const el = $("#sync"); if (el) el.outerHTML = syncHTML(); const d = $("#syncdot"); if (d) d.className = "dot " + syncCls(); }
function save(keys){
  lsSet(LS_DATA, S);
  if (keys) [].concat(keys).forEach(k => Sync.dirty.add(k));
  schedulePush();
}
function schedulePush(){ if (!Sync.db) return; clearTimeout(Sync.timer); Sync.timer = setTimeout(pushRemote, 700); }
async function pushRemote(){
  if (!Sync.db || !Sync.dirty.size) return;
  if (Sync.busy) { schedulePush(); return; }
  Sync.busy = true; setSync("saving");
  let failed = null;
  while (Sync.dirty.size) {
    const k = [...Sync.dirty][0]; Sync.dirty.delete(k);
    try {
      const ref = Sync.db.doc("data/users/" + Sync.uid + "/" + k);
      const cur = await withTimeout(ref.get(), 10000), rv = cur.exists ? cur.data() : null;
      if (k === "main") {
        if (rv) { S.players = mergeList(S.players, rv.players || [])[0]; S.tournaments = mergeList(S.tournaments, rv.tournaments || [])[0]; S.wg = newerWg(S.wg, rv.wg); }
        await ref.set({players: S.players, tournaments: S.tournaments, ...(S.wg ? {wg: S.wg} : {}), v: 1});
      } else {
        if (rv) S.history = mergeList(S.history, rv.games || [])[0];
        await ref.set({games: S.history.filter(h => monthKey(h.date) === k)});
      }
      lsSet(LS_DATA, S);
    } catch (e) { Sync.dirty.add(k); failed = e; Sync.lastError = (e && (e.code || e.message)) || String(e); break; }
  }
  Sync.busy = false;
  setSync(failed ? (failed.code === "quota_exceeded" ? "full" : "offline") : "ok");
  if (failed) toast("Speichern im Konto fehlgeschlagen (" + Sync.lastError + "). Es wird erneut versucht.");
  else Sync.lastError = null;
}
const newerWg = (a, b) => !a ? (b || null) : !b ? a : ((b.updatedAt || 0) > (a.updatedAt || 0) ? b : a);
function mergeList(local, remote){
  const map = new Map(); let localNewer = false;
  for (const r of remote) map.set(r.id, r);
  for (const l of local) { const r = map.get(l.id); if (!r || (l.updatedAt||0) > (r.updatedAt||0)) { map.set(l.id, l); localNewer = true; } }
  return [[...map.values()], localNewer];
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), ms))]);
async function pullRemote(){
  if (!Sync.db) return;
  try {
    const snap = await withTimeout(Sync.db.collection("data/users/" + Sync.uid).get(), 10000);
    const remote = {players:[], tournaments:[], history:[]};
    for (const d of snap.docs) { const v = d.data(); if (!v) continue;
      if (d.id === "main") { remote.players = v.players || []; remote.tournaments = v.tournaments || []; remote.wg = v.wg || null; }
      else if (d.id.startsWith("h-")) remote.history.push(...(v.games || []));
    }
    const before = JSON.stringify(S);
    const [pl, a] = mergeList(S.players, remote.players);
    const [to, b] = mergeList(S.tournaments, remote.tournaments);
    const [hi, c] = mergeList(S.history, remote.history);
    const wg = newerWg(S.wg, remote.wg);

function x01Stats(p, score, darts){
  p.st.darts += darts; p.st.pts += score;
  const f9 = Math.max(0, Math.min(darts, 9 - p.legDarts));
  if (f9 > 0) { p.st.f9d += f9; p.st.f9p += score * f9 / darts; }
  p.legDarts += darts; p.legPts = (p.legPts || 0) + score;
  if (score >= 100) p.leg100 = (p.leg100 || 0) + 1;
  if (score === 180) p.st.s180++; else if (score >= 140) p.st.s140++; else if (score >= 100) p.st.s100++;
  if (score > p.st.hi) p.st.hi = score;
}

  G.coScore = v; G.coBull = bull;
  p.st.dbl = (p.st.dbl || 0) + dbl;
  const bust = nr < 0 || (st.outRule !== "straight" && nr === 1) || (nr === 0 && !checkout(v, 3, st.outRule));
  const sc = bust ? 0 : v;
  x01Stats(p, sc, bust ? 3 : darts);
  p.last = bust ? "Bust" : v;
  UI.kp = "";
  if (bust) { toast("Bust! Rest bleibt " + p.rem); say("Überworfen"); advance(); return; }
  p.rem = nr;
  if (p.rem === 0) { say("Game shot"); if (v > p.st.hiCo) p.st.hiCo = v; x01LegWon(G.cur); } else { say(String(v)); funScore(v); lowScoreFx(G.cur); advance(); }
}
function x01Dart(n, m){
  const p = G.p[G.cur], st = G.settings;
  if (G.visit.length === 0) { G.vStart = p.rem; G.vIn = p.isIn; }
  let val = n * m;
  if (p.isIn && st.outRule !== "straight" && checkout(p.rem, 1, st.outRule)) p.st.dbl = (p.st.dbl || 0) + 1;
  if (!p.isIn) { if (m === 2 && n > 0) p.isIn = true; else val = 0; }
  G.visit.push(dartLabel(n, m));
  const nr = p.rem - val;
  const fin = st.outRule === "straight" || m === 2 || (st.outRule === "master" && m === 3);
  if (nr < 0 || (st.outRule !== "straight" && nr === 1) || (nr === 0 && !fin)) { p.rem = G.vStart; p.isIn = G.vIn; x01EndVisit(true); return; }

  if (bust) { toast("Bust! Rest bleibt " + p.rem); say("Überworfen"); }
  else say(p.rem === 0 ? "Game shot" : String(sc));

  let matchWon = false;

    if (!G.ranks.length && wgOn()) {
      const others = G.p.filter((q, j) => j !== i && !q.fin);
      G.wg = {winner: i, bull: !!G.coBull, big: (G.coScore || 0) >= 100, over200: others.some(q => q.rem > 200), tons: (p.leg100 || 0) >= 3};
    }
    if (playerFinished(i)) return;
    /* the others play on in the same leg, from their current scores */
    G.visit = []; advance(); return;
  }
  G.legStarter = nextActiveFrom(G.legStarter);
  G.p.forEach(q => { q.rem = st.start; q.legDarts = 0; q.legPts = 0; q.leg100 = 0; q.lowFx = false; q.isIn = st.inRule !== "double"; q.last = null; });
  G.cur = G.legStarter; G.legNo++; G.visit = [];
}

/* ---------- Cricket ---------- */
const CR = [20,19,18,17,16,15,25];
function crDart(n, m){
  const p = G.p[G.cur], others = G.p.filter((q, j) => j !== G.cur && !inactive(j));
  if (n === 25 && m === 3) m = 2;
  G.visit.push(dartLabel(n, m)); p.darts++;
  if (n && CR.includes(n)) {
    const cur = p.marks[n], need = Math.max(0, 3 - cur), extra = Math.max(0, m - need);
    p.marks[n] = cur + m;
    let eff = Math.min(m, need);
    if (extra > 0) {
      const open = others.filter(q => q.marks[n] < 3);
      if (open.length) {
        eff += extra;
        if (G.settings.variant === "cutthroat") open.forEach(q => q.pts += extra * n); else p.pts += extra * n;
      }
    }
    p.mk += eff;
  }
  if (CR.every(t => p.marks[t] >= 3)) {
    const ok = G.settings.variant === "cutthroat" ? others.every(q => p.pts <= q.pts) : others.every(q => p.pts >= q.pts);
    if (ok) { if (playerFinished(G.cur)) return; G.visit = []; advance(); return; }
  }
  if (G.visit.length >= 3) crEndVisit();
}
function crEndVisit(){
  G.visit = [];
  advance();
  if (G.settings.rounds && G.round > G.settings.rounds) { G.round = G.settings.rounds; finishGame(); }
}

/* ---------- Around the Clock ---------- */
const atcTargets = st => [...Array.from({length:20}, (_, i) => i + 1), ...(st.bull === "yes" ? [25] : [])];
function atcLabel(st, t){ if (t === 25) return st.variant === "double" ? "Bull" : "25/Bull"; return (st.variant === "double" ? "D" : st.variant === "triple" ? "T" : "") + t; }
function atcDart(hit){
  const p = G.p[G.cur], T = atcTargets(G.settings);
  G.visit.push(hit ? "✓" : "–"); p.darts++;
  if (hit) { p.idx++; p.hits++; if (p.idx >= T.length) { if (playerFinished(G.cur)) return; G.visit = []; advance(); return; } }
  if (G.visit.length >= 3) { G.visit = []; advance(); }
}

/* ---------- Bob's 27 ---------- */
const BOB_T = [...Array.from({length:20}, (_, i) => i + 1), 25];
function bobVisit(h){
  const p = G.p[G.cur], t = BOB_T[p.idx], v = t === 25 ? 50 : 2 * t;
  p.darts += 3; p.hist.push(h);
  if (h > 0) { p.score += h * v; p.hits += h; } else p.score -= v;
  p.idx++;
  if (p.score <= 0) { p.out = true; toast(`${G.names[G.cur]} ist raus`); }
  if (p.idx >= BOB_T.length) p.done = true;
  if (!advance()) finishGame();
}

/* ---------- Shanghai ---------- */
function shDart(m){
  const p = G.p[G.cur];
  G.visit.push(m); p.darts++; p.score += m * G.round;
  if (G.visit.length === 3 && [1,2,3].every(x => G.visit.includes(x))) { G.shanghai = G.cur; G.ranks = [G.cur]; return finishGame(); }
  if (G.visit.length >= 3) {
    p.hist.push(G.visit.reduce((a, b) => a + b, 0) * G.round);
    G.visit = [];
    advance();
    if (G.round > G.settings.rounds) { G.round = G.settings.rounds; finishGame(); }
  }
}

/* ---------- Score training ---------- */
function scoreVisit(v){
  const p = G.p[G.cur];
  p.total += v; p.visits.push(v); p.darts += 3; UI.kp = "";
  say(String(v)); funScore(v);
  advance();
  if (G.round > G.settings.rounds) { G.round = G.settings.rounds; finishGame(); }
}

/* ---------- Checkout 121 ---------- */
function c121Visit(v, how){
  const p = G.p[G.cur], nr = p.rem - v;
  const bust = how === "bust" || (how !== "ok" && (nr < 0 || nr === 1 || (nr === 0 && !checkout(v, 3, "double"))));
  UI.kp = "";
  p.darts += 3; p.vInAtt++;
  if (bust) toast("Bust");
  else p.rem = nr;
  let attemptOver = false;
  if (p.rem === 0) { p.succ++; p.best = Math.max(p.best, p.target); p.hist.push(1); toast(`${p.target} gecheckt!`); p.target++; attemptOver = true; }
  else if (p.vInAtt >= 3) { p.hist.push(0); attemptOver = true; }
  if (attemptOver) { p.att++; p.rem = p.target; p.vInAtt = 0; if (p.att > G.settings.attempts) p.done = true; }
  if (!advance()) finishGame();
}

/* ---------- Single darts that add up to a visit (score training, checkout 121) ---------- */
function composeDart(n, m){
  if (n === 25 && m === 3) m = 2;
  G.visit.push(dartLabel(n, m)); G.vsum = (G.vsum || 0) + n * m;
  if (G.mode === "c121") {
    const r = G.p[G.cur].rem - G.vsum;
    if (r < 0 || r === 1 || (r === 0 && m !== 2)) return finishComposed("bust");
    if (r === 0) return finishComposed("ok");
  }
  if (G.visit.length >= 3) finishComposed();
}
function finishComposed(how){
  const v = G.vsum || 0; G.visit = []; G.vsum = 0;
  if (G.mode === "score") scoreVisit(v); else c121Visit(v, how);
}

/* ---------- Halve-It ---------- */
const HALVE_T = [15, 16, "D", 17, 18, "T", 19, 20, "B"];
const halveLabel = t => t === "D" ? "Doppel" : t === "T" ? "Triple" : t === "B" ? "Bull" : String(t);
const halveMax = t => t === "D" ? 120 : t === "T" ? 180 : t === "B" ? 150 : 9 * t;
function halveQuick(t){
  if (t === "B") return [25, 50, 75, 100, 125, 150];
  if (t === "D" || t === "T") return [];
  return [t, 2 * t, 3 * t, 4 * t, 5 * t, 6 * t, 7 * t, 9 * t];
}
function halveVisit(v){
  const p = G.p[G.cur];
  p.darts += 3; p.hist.push(v); UI.kp = "";
  if (v === 0) { p.score = Math.floor(p.score / 2); p.zeros++; toast(`Halbiert: ${G.names[G.cur]} hat noch ${p.score}`); }
  else p.score += v;
  advance();
  if (G.round > HALVE_T.length) { G.round = HALVE_T.length; finishGame(); }
}

/* ================= Tournaments ================= */
const nextPow2 = n => { let p = 1; while (p < n) p *= 2; return p; };
function seedOrder(n){ let a = [1, 2]; while (a.length < n) { const m = a.length * 2; a = a.flatMap(s => [s, m + 1 - s]); } return a.slice(0, n); }
const mkMatch = (a, b) => ({id: uid(), a, b, sa: null, sb: null, w: null});
function createTournament(){
  const f = UI.tf, t = Date.now();
  const pids = f.shuffle === "yes" ? shuffle(f.sel) : [...f.sel];
  const T = {id: uid(), name: (f.name || "").trim() || "Turnier " + new Date().toLocaleDateString("de-DE"), format: f.format, pids,
    settings: {start: f.start, outRule: f.outRule, inRule: "straight", legs: f.legs, sets: 1, input: "visit", ranks: "no", startMode: f.startMode}, createdAt: t, updatedAt: t, champion: null};
  if (f.format === "ko") {
    const n = nextPow2(pids.length), order = seedOrder(n), r0 = [];
    for (let i = 0; i < n; i += 2) r0.push(mkMatch(pids[order[i] - 1] ?? null, pids[order[i + 1] - 1] ?? null));
    T.rounds = [r0];
    for (let size = n / 4; size >= 1; size /= 2) T.rounds.push(Array.from({length: size}, () => mkMatch(null, null)));
    r0.forEach((m, i) => { if (!!m.a !== !!m.b) { m.w = m.a || m.b; m.bye = true; if (T.rounds[1]) T.rounds[1][Math.floor(i / 2)][i % 2 ? "b" : "a"] = m.w; else T.champion = m.w; } });
  } else if (f.format === "dko") {
    createDKO(T, pids);
  } else {
    const a = [...pids]; if (a.length % 2) a.push(null);
    const n = a.length; T.matches = [];
    for (let r = 0; r < n - 1; r++) {
      for (let i = 0; i < n / 2; i++) { const x = a[i], y = a[n - 1 - i]; if (x && y) T.matches.push({...mkMatch(r % 2 ? y : x, r % 2 ? x : y), rd: r + 1}); }
      a.splice(1, 0, a.pop());
    }
    if (f.twice === "yes") { const k = n - 1; T.matches.push(...T.matches.map(m => ({...mkMatch(m.b, m.a), rd: m.rd + k}))); }
  }
  S.tournaments.push(T); save("main");
  UI.tId = T.id; UI.view = "tdetail";
  UI.tf = {...UI.tf, name: "", sel: []};
}
/* ---------- Double elimination: winners bracket, losers bracket, grand final (+ reset) ---------- */
const BYE = "__bye";
const isP = id => id && id !== BYE;
const byId = (T, id) => T.matches.find(m => m.id === id);
function createDKO(T, pids){
  const n = Math.max(2, nextPow2(pids.length)), k = Math.round(Math.log2(n)), order = seedOrder(n), M = [];
  const mk = (bk, r) => { const m = {...mkMatch(null, null), bk, r, wTo: null, lTo: null}; M.push(m); return m; };
  const WB = [];
  for (let r = 0; r < k; r++) WB.push(Array.from({length: n / 2 ** (r + 1)}, () => mk("W", r)));
  WB[0].forEach((m, i) => { m.a = pids[order[2 * i] - 1] ?? BYE; m.b = pids[order[2 * i + 1] - 1] ?? BYE; });
  for (let r = 0; r < k - 1; r++) WB[r].forEach((m, i) => m.wTo = [WB[r + 1][i >> 1].id, i % 2 ? "b" : "a"]);
  const LB = [];
  if (k >= 2) {
    LB.push(Array.from({length: n / 4}, () => mk("L", 0)));
    WB[0].forEach((m, i) => m.lTo = [LB[0][i >> 1].id, i % 2 ? "b" : "a"]);
    for (let s = 1; s <= k - 1; s++) {
      const prev = LB[LB.length - 1];
      const drop = Array.from({length: prev.length}, () => mk("L", LB.length));
      prev.forEach((m, i) => m.wTo = [drop[i].id, "a"]);
      WB[s].forEach((m, i) => m.lTo = [drop[WB[s].length - 1 - i].id, "b"]);
      LB.push(drop);
      if (s < k - 1) { const merge = Array.from({length: drop.length / 2}, () => mk("L", LB.length)); drop.forEach((m, i) => m.wTo = [merge[i >> 1].id, i % 2 ? "b" : "a"]); LB.push(merge); }
    }
  }
  const g1 = mk("F", 0), g2 = mk("F", 1);
  WB[k - 1][0].wTo = [g1.id, "a"];
  if (k >= 2) LB[LB.length - 1][0].wTo = [g1.id, "b"]; else WB[0][0].lTo = [g1.id, "b"];

function dkoSet(T, id, slot, val){

}
function dkoPlace(T, m){ if (m.wTo) dkoSet(T, m.wTo[0], m.wTo[1], m.w); if (m.lTo) dkoSet(T, m.lTo[0], m.lTo[1], m.l); }

      if (m.a === BYE || m.b === BYE) { m.w = m.a === BYE ? m.b : m.a; m.l = BYE; m.bye = true; dkoPlace(T, m); ch = true; }
    }
  }
  const [g1, g2] = T.gf.map(id => byId(T, id));
  T.champion = null;
  if (g1.w != null) {
    if (g1.w === g1.a) { g2.skip = true; T.champion = g1.w; }
    else { g2.skip = false; if (g2.a !== g1.a || g2.b !== g1.b) { g2.a = g1.a; g2.b = g1.b; g2.w = g2.l = g2.sa = g2.sb = null; } if (g2.w != null) T.champion = g2.w; }
  } else { g2.skip = true; }
}
/* may a played result still be changed? Only while the follow-up matches are unplayed */
function canEditMatch(T, m){
  if (T.format === "league") return true;
  if (T.format === "ko") { const f = findMatch(T, m.id); const next = f.r + 1 < T.rounds.length ? T.rounds[f.r + 1][Math.floor(f.i / 2)] : null; return !next || !next.w; }
  const free = t => { if (!t) return true; const x = byId(T, t[0]); return x.w == null || x.bye; };
  if (m.id === T.gf[0]) { const g2 = byId(T, T.gf[1]); return g2.w == null; }
  return free(m.wTo) && free(m.lTo);
}
function findMatch(T, mid){
  if (T.format === "ko") { for (let r = 0; r < T.rounds.length; r++) { const i = T.rounds[r].findIndex(m => m.id === mid); if (i >= 0) return {m: T.rounds[r][i], r, i}; } }
  else { const i = T.matches.findIndex(m => m.id === mid); if (i >= 0) return {m: T.matches[i]}; }

}

  const f = findMatch(T, mid); if (!f) return;
  const m = f.m; m.sa = sa; m.sb = sb; m.w = sa > sb ? m.a : m.b;
  if (T.format === "dko") { m.l = sa > sb ? m.b : m.a; dkoPlace(T, m); dkoResolve(T); }
  else if (T.format === "ko") {
    if (f.r + 1 < T.rounds.length) { const nm = T.rounds[f.r + 1][Math.floor(f.i / 2)]; nm[f.i % 2 ? "b" : "a"] = m.w; }
    else T.champion = m.w;
  } else T.champion = T.matches.every(x => x.w) ? leagueTable(T)[0].id : null;

function applyTournamentResult(){
  const T = S.tournaments.find(t => t.id === G.tournament.tid); if (!T) return;
  const f = findMatch(T, G.tournament.mid); if (!f) return;
  G.tPrev = JSON.stringify(T);

  setMatchResult(T, G.tournament.mid, G.p[ia].st.legsWon, G.p[ib].st.legsWon);

function leagueTable(T){
  const rows = Object.fromEntries(T.pids.map(id => [id, {id, sp: 0, s: 0, n: 0, lf: 0, la: 0, pts: 0}]));
  for (const m of T.matches) { if (!m.w) continue; const A = rows[m.a], B = rows[m.b];
    A.sp++; B.sp++; A.lf += m.sa; A.la += m.sb; B.lf += m.sb; B.la += m.sa;

const FORMAT_NAME = {ko: "K.-o.-System", dko: "Doppel-K.-o.", league: "Liga"};

  if (!data.length) return "";

function x01Section(pids, list, multi){

  }

    ["Halve-It: Bestwert", id => { const r = by(id, "halveit"); return r.length ? V(Math.max(...r.map(x => x.score))) : null; }, "hi"],
    ["Checkout 121: Erfolgsquote", id => { const r = by(id, "c121"), s = r.reduce((a, x) => a + x.succ, 0), n = r.reduce((a, x) => a + x.tries, 0); return n ? V(s / n, pct(s, n)) : null; }, "hi"],
  ]);

function wgSection(list){
  const games = list.filter(h => h.wg);
  if (!games.length) return "";
  const tot = {};
  for (const h of games) { const t = tot[h.wg.pid] ||= {strokes: 0, wins: 0, extra: 0}; t.strokes += h.wg.strokes; t.wins++; t.extra += h.wg.strokes - 1; }
  const ids = [...new Set(games.flatMap(h => h.pids))].sort((a, b) => (tot[b]?.strokes || 0) - (tot[a]?.strokes || 0));
  return `<section class="panel"><h2 class="h3">WG-Strichliste <span class="small muted">${games.length} Spiele</span></h2>
    <div class="tbl-scroll"><table class="tbl num"><thead><tr><th>Spieler</th><th>Striche</th><th>Siege</th><th>Extrastriche</th></tr></thead><tbody>
    ${ids.map((id, i) => { const t = tot[id] || {strokes: 0, wins: 0, extra: 0}; return `<tr class="${i === 0 ? "me" : ""}"><td>${esc(pname(id))}</td><td><b>${t.strokes}</b></td><td>${t.wins}</td><td>${t.extra}</td></tr>`; }).join("")}
    </tbody></table></div></section>`;
}
function trend(series){
  const all = series.flatMap(s => s.vals);
  if (!all.length) return "";
  const W = 320, H = 100, pl = 30, pr = 8, pt = 10, pb = 18;
  const min = Math.floor(Math.min(...all) / 5) * 5, max = Math.max(min + 5, Math.ceil(Math.max(...all) / 5) * 5), span = max - min;
  const y = v => pt + (1 - (v - min) / span) * (H - pt - pb);
  const lines = series.filter(s => s.vals.length > 1).map(s => {
    const x = i => pl + i * (W - pl - pr) / (s.vals.length - 1);
    const pts = s.vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const L = s.vals.length - 1;
    return `<g class="c${s.c}"><polyline points="${pts}" fill="none" stroke="var(--pc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(L)}" cy="${y(s.vals[L])}" r="3.5" fill="var(--pc)"/></g>`;
  }).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average-Verlauf">
    <line x1="${pl}" x2="${W - pr}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)"/><line x1="${pl}" x2="${W - pr}" y1="${y(min)}" y2="${y(min)}" stroke="var(--line)"/>
    <text x="${pl - 6}" y="${y(max) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${max}</text><text x="${pl - 6}" y="${y(min) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${min}</text>
    ${lines}<text x="${pl}" y="${H - 3}" font-size="11" fill="var(--muted)">älter</text><text x="${W - pr}" y="${H - 3}" text-anchor="end" font-size="11" fill="var(--muted)">neuestes Spiel</text></svg>`;
}
function duelsSection(pids, list){
  if (pids.length < 2) return `<p class="muted small" style="margin:0">Wähle oben einen zweiten oder dritten Spieler, um die direkten Duelle zu sehen.</p>`;
  const pairs = []; for (let i = 0; i < pids.length; i++) for (let j = i + 1; j < pids.length; j++) pairs.push([i, j]);
  return `<section><h2 class="h2">Direkte Duelle</h2><div style="display:flex;flex-direction:column;gap:10px">${pairs.map(([i, j]) => {
    const a = pids[i], b = pids[j], games = list.filter(h => h.pids.includes(a) && h.pids.includes(b));
    if (!games.length) return `<div class="duel"><div class="duel-score"><span class="who c${i + 1}">${esc(pname(a))}</span><span class="ds num">–</span><span class="who c${j + 1}">${esc(pname(b))}</span></div><div class="small muted">Noch kein gemeinsames Spiel.</div></div>`;
    let wa = 0, wb = 0, la = 0, lb = 0; const xa = {pts: 0, darts: 0}, xb = {pts: 0, darts: 0}; let nx = 0, nc = 0, nk = 0;
    for (const h of games) {
      const ra = rankOf(h, a), rb = rankOf(h, b); if (ra < rb) wa++; else if (rb < ra) wb++;
      if (h.mode === "x01") { nx++; la += h.res[a].legsWon || 0; lb += h.res[b].legsWon || 0; xa.pts += h.res[a].pts; xa.darts += h.res[a].darts; xb.pts += h.res[b].pts; xb.darts += h.res[b].darts; } else if (h.mode === "cricket") nc++; else nk++;
    }
    const tot = wa + wb || 1;
    const facts = [`${games.length} gemeinsame ${games.length === 1 ? "Partie" : "Partien"}`];
    if (nx) facts.push(`X01: Legs ${la}:${lb}, Average ${fmt1(avgOf(xa))} zu ${fmt1(avgOf(xb))}`);
    if (nc) facts.push(`${nc}× Cricket`);
    const recent = games.slice(0, 4).map(h => { const ra = rankOf(h, a), rb = rankOf(h, b); const lead = ra < rb ? pname(a) : rb < ra ? pname(b) : null;
      return `<li>${fmtDate(h.date)} · ${esc(MODES[h.mode].name)}${h.mode === "x01" ? " " + h.settings.start : ""}${h.pids.length > 2 ? ` (${h.pids.length} Spieler)` : ""} · ${lead ? esc(lead) + (h.pids.length > 2 ? " vorne" : " gewinnt") : "gleich"}${h.mode === "x01" ? ` · ${h.res[a].legsWon}:${h.res[b].legsWon}` : ""}</li>`; }).join("");
    return `<div class="duel"><div class="duel-score"><span class="who c${i + 1}">${esc(pname(a))}</span><span class="ds num">${wa} : ${wb}</span><span class="who c${j + 1}">${esc(pname(b))}</span></div>
      <div class="duel-bar"><i class="c${i + 1}" style="width:${wa / tot * 100}%;background:var(--pc)"></i><i class="c${j + 1}" style="width:${wb / tot * 100}%;background:var(--pc)"></i></div>
      <div class="small muted">${facts.join(" · ")}</div><ul>${recent}</ul></div>`;
  }).join("")}</div></section>`;
}

function kpSubmit(v){
  if (!G || G.finished) return;
  if (G.mode === "halveit") {
    const t = HALVE_T[G.round - 1];
    if (v > halveMax(t)) { toast(`Auf ${halveLabel(t)} sind höchstens ${halveMax(t)} Punkte möglich`); UI.kp = ""; render(); return; }
    act(() => halveVisit(v)); return;
  }
  if (v > 180 || !POSSIBLE.has(v)) { toast(v + " ist mit drei Darts nicht möglich"); UI.kp = ""; render(); return; }
  if (G.mode === "x01") {
    const p = G.p[G.cur], st = G.settings, out = st.outRule, R = p.rem, nr = R - v;
    const track = out !== "straight" && st.dblTrack !== "no";
    const bust = nr < 0 || (out !== "straight" && nr === 1) || (nr === 0 && !checkout(v, 3, out));
    const T = dblTable(R, out);
    const range = k => (track && T.get(k)) || [0, 0];
    if (nr === 0 && !bust) {
      const ds = [1, 2, 3].filter(d => T.has("co|" + d));
      const ranges = Object.fromEntries(ds.map(d => [d, range("co|" + d)]));
      if (ds.length === 1 && ranges[ds[0]][0] === ranges[ds[0]][1]) { const d = ds[0]; finishCheckout(v, d, ranges[d][0]); return; }
      UI.modal = {type: "coDarts", v, ds, ranges, d: ds.length === 1 ? ds[0] : null}; render(); return;
    }
    const [lo, hi] = range(bust ? "0" : String(v));
    if (lo === hi) { act(() => x01ApplyVisit(v, 3, lo)); return; }
    UI.modal = {type: "dbl", v, lo, hi}; render(); return;
  } else if (G.mode === "score") act(() => scoreVisit(v));
  else if (G.mode === "c121") act(() => c121Visit(v));
}
/* For a remaining score R, every possible visit (up to three darts, misses included) is played through once.
   A dart counts as thrown at a double when the score before it can be finished with that one dart (40 and less
   on an even number, or 50). For each outcome (points scored, a bust, or a checkout with 1 to 3 darts) the table
   keeps the fewest and the most darts that can have gone at a double. */
const dblCache = new Map();
function dblTable(R, out){
  const key = R + "|" + out;
  if (dblCache.has(key)) return dblCache.get(key);
  const T = new Map(), opts = [{n: 0, m: 1, v: 0}, ...SEGS];
  const atDouble = r => !!checkout(r, 1, out);
  const add = (k, a) => { const x = T.get(k); if (!x) T.set(k, [a, a]); else { if (a < x[0]) x[0] = a; if (a > x[1]) x[1] = a; } };
  const walk = (r, d, att) => {
    if (d === 3) { add(String(R - r), att); return; }
    const a2 = att + (atDouble(r) ? 1 : 0);
    for (const s of opts) {
      const nr = r - s.v;
      if (nr < 0 || (out !== "straight" && nr === 1) || (nr === 0 && !finOk(s, out))) { add("0", a2); continue; }
      if (nr === 0) { add("co|" + (d + 1), a2); continue; }
      walk(nr, d + 1, a2);
    }
  };
  walk(R, 0, 0);
  dblCache.set(key, T);
  return T;
}

const pickOne = a => a[Math.floor(Math.random() * a.length)];

/* weak scoring: after at least three visits in a leg, still far from the finish, leg average under 30 */
const LOW = [n => "Haste nen schwachen Arm?", n => "Haste das Werfen verlernt?", n => `${n}, das Board ist da vorne.`, n => `Aufwärmen ist vorbei, ${n}.`, n => "Sind die Darts zu schwer?"];

  if (avg >= 30) return;
  p.lowFx = true;
  const n = G.names[i].trim();
  fx(isName(n, "ole") ? "Ein Klassiker." : pickOne(LOW)(n), `${n} · ${fmt1(avg)} Average in diesem Leg`, "rage");
}

  if (v === 26) fx(pickOne(["Waschma!", "Waschmaschine!", "Washing machine!"]), "26 Punkte", "wash", true);
  else if (v === 29) fx("Waschmaschine des kleinen Mannes", "29 Punkte", "wash", true);

const RAGE = [
  n => `${n}, das war wohl nix.`, n => `${n}, die Scheibe hängt übrigens da vorne.`, n => `Training ist kein Fremdwort, ${n}.`,
  n => `${n}, hast du die Darts falsch rum gehalten?`, n => `Kopf hoch, ${n}. Ach nee, lieber den Arm.`, n => `${n} spendiert die nächste Runde.`,

  const losers = G.order.slice(1).map(i => G.names[i]), members = wgCfg().members;
  fxQueue = fxQueue.filter(f => f.kind === "rage"); if (fxBusy && !$("#fx .fx.rage")) { clearTimeout(fxTimer); fxBusy = false; }

  const ole = losers.find(n => isName(n, "ole"));
  if (ole) fx("MAAAN, das kann doch nicht sein!", ole, "rage");
  const rival = G.order.slice(1).filter(i => members.includes(G.pids[i]) && !isName(G.names[i], "ole")).map(i => G.names[i]);
  if (rival.length) { const n = rival[rival.length - 1].trim(); fx(pickOne(RAGE)(n), "", "rage"); }

function strokesSVG(n){
  let out = "", x = 0;
  for (let g = 0; g < Math.ceil(n / 5); g++) {
    const k = Math.min(5, n - g * 5), w = 4 * 9 + 6;
    let lines = "";
    for (let i = 0; i < Math.min(k, 4); i++) lines += `<line x1="${x + 4 + i * 9}" y1="4" x2="${x + 4 + i * 9}" y2="32" />`;
    if (k === 5) lines += `<line x1="${x - 1}" y1="28" x2="${x + 34}" y2="8" />`;
    out += lines; x += w + 8;
  }
  return `<svg viewBox="-4 0 ${Math.max(40, x)} 36" height="36" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">${out}</svg>`;
}

const PALETTES = [["classic","Klassik","#C21F31","#14683F"],["ocean","Ozean","#1D5FC4","#0B7A70"],["pub","Kneipe","#9E2235","#9A5F0C"],["violet","Violett","#7A3FD1","#3F7F12"],["orange","Orange","#C9430C","#1B6E8C"]];
function applyTheme(){

  if (t === "system") root.removeAttribute("data-app-theme"); else root.setAttribute("data-app-theme", t);

  const dark = t === "dark" || (t === "system" && (host === "dark" || (host !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)));
  root.setAttribute("data-mode", dark ? "dark" : "light");
  root.setAttribute("data-palette", prefs.palette || "classic");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", getComputedStyle(document.body).backgroundColor);
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}

function say(text, force){
  if ((prefs.voice || "off") !== "on" && !force) return;

    const ss = window.speechSynthesis; if (!ss) return;

    const v = ss.getVoices().find(x => /^de/i.test(x.lang)); if (v) u.voice = v;
    ss.speak(u);
  } catch (e) {}
}
