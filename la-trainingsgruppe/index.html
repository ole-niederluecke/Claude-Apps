<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LT DSHS Köln</title>
<meta name="theme-color" content="#F4F4F3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LT DSHS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<script src="vendor/supabase-2.118.0.js"></script>
<style>
:root{
  --bg:#F4F4F3; --surface:#FFFFFF; --surface-2:#ECECEA; --line:#D9D9D6; --fg:#111111; --muted:#5E5E5B;
  --accent:#111111; --on-accent:#FFFFFF; --accent-soft:#E4E4E2;
  --ok:#1F6E45; --ok-soft:#E1EFE7; --danger:#B3261E; --danger-soft:#F8E0DE;
  --field:#6B6B68;
  --ph1:#2a78d6; --ph2:#1baf7a; --ph3:#6250d6; --ph4:#008300; --tw:#eda100; --wk:#eb6834;

  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#161616; --surface-2:#222222; --line:#333333; --fg:#F2F2F2; --muted:#A3A3A3;
    --accent:#FFFFFF; --on-accent:#0A0A0A; --accent-soft:#2A2A2A;
    --ok:#6FCF97; --ok-soft:#163222; --danger:#FF8A80; --danger-soft:#3E1B19;
    --ph1:#3987e5; --ph2:#199e70; --ph3:#9085e9; --ph4:#0ca30c; --tw:#c98500; --wk:#d95926;
    --field:#8C8C8C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --surface-2:#222222; --line:#333333; --fg:#F2F2F2; --muted:#A3A3A3;
    --accent:#FFFFFF; --on-accent:#0A0A0A; --accent-soft:#2A2A2A;
    --ok:#6FCF97; --ok-soft:#163222; --danger:#FF8A80; --danger-soft:#3E1B19;
    --ph1:#3987e5; --ph2:#199e70; --ph3:#9085e9; --ph4:#0ca30c; --tw:#c98500; --wk:#d95926;
    --field:#8C8C8C; color-scheme:dark;
}
html{font-size:16px} html[data-text="large"]{font-size:18.5px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 .95rem/1.5 var(--body);-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
body.no-nav{padding-bottom:24px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:50%;flex:none}
.top h1{font:700 1.45rem/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:.78rem;color:var(--muted)}
.top .grow{flex:1;min-width:0}

main{max-width:680px;margin:0 auto;padding:16px}
h2{font:700 1.25rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:22px 4px 10px}
h2:first-child{margin-top:4px}
h3{font-size:1rem;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:.82rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flush{padding:4px 0}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
  border:10px solid var(--accent-soft);box-shadow:0 0 0 14px var(--surface),0 0 0 24px var(--accent-soft),0 0 0 28px var(--surface),0 0 0 38px var(--accent-soft);pointer-events:none}
.hero h3{font:700 1.7rem/1.1 var(--display);margin-bottom:8px;position:relative;z-index:1}
.hero > *{position:relative;z-index:1}

.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
button.row{width:100%;text-align:left}
button.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .name,.row .meta{display:block}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem;
  background:var(--surface-2);color:var(--fg)}
.avatar.admin{background:var(--accent);color:var(--on-accent)}
.avatar.trainer{background:var(--field);color:#fff}
.chev{color:var(--muted);flex:none}
.subhead{padding:12px 16px 4px;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.subhead:first-child{border-top:0}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.admin{background:var(--accent);color:var(--on-accent)}
.chip.trainer{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.chip.off{background:var(--danger-soft);color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;
  background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 auto}
.linkbtn{color:var(--accent);font-weight:600;padding:6px 2px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}

label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=url],select{width:100%;min-height:46px;padding:10px 12px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt b{display:block}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.setrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .grow{flex:1;min-width:0}

.notice{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--fg);color:var(--fg);margin-bottom:12px}
.notice .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 1.7rem/1 var(--display)}
.stat span{font-size:.75rem;color:var(--muted)}
.soon li{padding:6px 0;color:var(--muted)}
.soon{margin:0;padding-left:18px}

/* Navigation unten */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex;height:var(--nav-h)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.68rem;display:grid;place-items:center}

/* Anmeldung */
.auth{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 16px 24px}
.auth .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
.auth .brand img{width:132px;height:132px;border-radius:50%;margin-bottom:14px}
.auth .brand h1{font:700 2rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}

.demo-bar{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.85rem}
.demo-bar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.demo-bar select{min-height:34px;padding:4px 8px;width:auto;flex:1;min-width:150px}
.demo-bar .demo-hint{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);flex-wrap:nowrap;align-items:flex-start}

/* Dialog */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:90vh;border-radius:20px 20px 0 0;
  background:var(--surface);color:var(--fg);box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media (min-width:600px){dialog.sheet{margin:auto;border-radius:20px}}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
dialog .sheet-in{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:90vh}
dialog h3{font:700 1.4rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 14px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) translateY(20px);
  background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.9rem;font-weight:500;max-width:calc(100% - 32px);
  opacity:0;transition:opacity .2s,transform .2s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger);color:#fff}
/* Plan */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav .grow{flex:1;text-align:center}
.planhead{padding:0 4px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.86rem;white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;scroll-margin-top:80px}
.daycard.today{border:2px solid var(--fg)}
.daycard.empty{padding:10px 16px}
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayname{font:700 1.15rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.daytitle{font-weight:700;margin-top:6px;display:block}
.chip.solid{background:var(--accent);color:var(--on-accent)}
.items{list-style:none;margin:8px 0 0;padding:0}
.items li.gap{margin-top:10px}
.item{display:flex;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.item .ix{flex:none;min-width:26px;font-size:.72rem;font-weight:800;color:var(--muted);padding-top:3px}
.item .ibody{flex:1;min-width:0;display:block}
.item .irow{display:flex;gap:10px;align-items:baseline}
.item .rx{flex:none;margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.rxchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rxchip{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.rxchip.rest{background:transparent;border:1px solid var(--line);color:var(--muted)}.rxchip svg{width:12px;height:12px}
.rxtargets{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-size:.8rem;font-variant-numeric:tabular-nums}
.rxt{display:contents}.rxt .who{color:var(--muted)}
.rxsteps{display:block;margin-top:5px;font-size:.82rem}.rxsteps span{display:flex;gap:8px;padding:1px 0}.rxsteps b{flex:none;width:14px;color:var(--muted);font-weight:700}
.rxnote{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
.items li:first-child .item{border-top:0}
.item .it{flex:1;min-width:0}
.item .it.known{text-decoration:underline dotted;text-underline-offset:3px}

.vid{display:inline-flex;vertical-align:-2px;color:var(--muted)}
.extra summary{cursor:pointer}
.tablewrap{overflow-x:auto;margin-top:10px}
table.grid{border-collapse:collapse;font-size:.85rem}
table.grid td{border:1px solid var(--line);padding:5px 8px;vertical-align:top;white-space:nowrap}
.linkcard{display:block;width:100%;text-align:left}
.rowbtn{text-align:left;min-width:0}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1;min-width:0;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg)}
.exvideo{width:100%;max-height:60vh;border-radius:12px;background:#000;margin:8px 0}
.pre{white-space:pre-wrap}
.maprow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.maprow select{width:48%;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg);font:inherit;resize:vertical}
input[type=date],input[type=time]{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg)}
/* Termine */
.sess{padding:14px 16px 0}
.sess.cancelled{padding-bottom:14px;opacity:.7}
.sesshead{display:flex;gap:14px;align-items:flex-start}
.sessdate{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--surface-2);padding:6px 0}
.sessdate b{display:block;font:700 1.25rem/1 var(--display);text-transform:uppercase}
.sessdate span{font-size:.78rem;color:var(--muted)}
.sesstitle{font-weight:700}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.resp button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.resp button.on.yes{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.resp button.on.no{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.counts{display:flex;gap:6px;width:100%;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.counts button{flex:1;padding:8px 4px;border-radius:8px;background:var(--surface-2);color:var(--muted);text-align:center}
.counts b{color:var(--fg);font-size:1rem;margin-right:2px}
.reasons .opt{margin-bottom:6px;padding:10px 12px}
.hist{margin:0;padding-left:18px;font-size:.88rem}
.hist li{padding:3px 0}
.tplrow{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;margin-bottom:8px;align-items:center}
.tplrow select,.tplrow input{min-height:42px;padding:8px}
/* Supersätze, Saison, Statistik */
.items li.grp + li.grp{margin-top:10px}
.items li.grp .item{border-top:1px solid var(--line)}
.items li.grp:first-child .item:first-child{border-top:0}
.items li.grp.pair{border-left:3px solid var(--line);padding-left:10px;margin-left:-2px}
.items li.grp.pair .item{border-top:0}
.items li.grp.pair .item + .item{border-top:1px dashed var(--line)}
.itemlabel{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 0 2px}.itemlabel.who{text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--fg)}
.item.altitem .it{font-style:italic}
table.fmt{width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0 12px}table.fmt th,table.fmt td{border:1px solid var(--line);padding:4px 6px;text-align:left}
table.fmt thead th{background:var(--fg);color:var(--bg)}table.fmt tbody th{font-weight:600;color:var(--muted);white-space:nowrap;font-size:.74rem}
table.fmt .r-info td{background:var(--surface-2)}table.fmt .r-title td{font-weight:700}table.fmt .r-det td{font-style:italic;color:var(--muted)}table.fmt .r-gap td{height:10px}
.fmtlist{padding-left:18px}.fmtlist li{margin:4px 0}
.wutag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:8px 0 -4px}
.tlhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.tlwrap{position:relative;overflow-x:auto;margin:6px -4px 4px;padding:0 4px}
.tl{position:relative;height:120px;min-width:100%}
.tlwrap.big .tl{height:206px}
.tl-months{position:absolute;left:0;right:0;top:0;height:16px;border-bottom:1px solid var(--line)}
.tl-months span{position:absolute;top:0;font-size:.68rem;color:var(--muted);padding-left:3px;border-left:1px solid var(--line);height:100vh;max-height:118px;pointer-events:none}
.tlwrap.big .tl-months span{max-height:190px}
.tl-lane{position:absolute;left:0;right:0}
.tl-lane.ph{top:22px;height:40px}
.tl-lane.tw{top:68px;height:24px}
.tl-lane.wk{top:96px;height:18px}
.tlwrap.big .tl-lane.ph{height:60px}.tlwrap.big .tl-lane.tw{top:90px;height:30px}.tlwrap.big .tl-lane.wk{top:128px;height:22px}
.tl-bar{position:absolute;top:0;bottom:0;border-radius:7px;color:#fff;font-size:.72rem;font-weight:700;padding:0 6px;display:flex;align-items:center;overflow:hidden;text-align:left;border:2px solid var(--surface)}
.tl-bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bar.ph1{background:var(--ph1)}.tl-bar.ph2{background:var(--ph2)}.tl-bar.ph3{background:var(--ph3)}.tl-bar.ph4{background:var(--ph4)}
.tl-bar.cur{box-shadow:0 0 0 2px var(--fg)}
.tl-bar.tw{background:var(--tw);color:#0b0b0b}
.tl-bar.pause{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 12px);color:var(--fg)}.tl-bar.pause span{display:none}
.absentline{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
